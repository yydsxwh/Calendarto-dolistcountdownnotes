name: Android Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # setup-android@v3 仍会安装已经下架的 sdkmanager tools 包，任务会在装 SDK 时失败。
      - name: Install Android SDK
        run: |
          set -euo pipefail
          root="$HOME/android-sdk"
          mkdir -p "$root/cmdline-tools"
          curl -fsSL -o /tmp/android-cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/android-cmdtools
          unzip -q /tmp/android-cmdtools.zip -d /tmp/android-cmdtools
          rm -rf "$root/cmdline-tools/latest"
          mkdir -p "$root/cmdline-tools/latest"
          mv /tmp/android-cmdtools/cmdline-tools/* "$root/cmdline-tools/latest/"
          yes | "$root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$root" --licenses >/dev/null
          "$root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$root" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kemiao-days-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
