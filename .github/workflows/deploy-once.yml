name: Deploy Days Once Verified

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-once.yml'

permissions:
  contents: read
  statuses: write

env:
  DAYS_WEB_ROOT: ${{ vars.DAYS_WEB_ROOT || '/var/www/yyds-course-platform/public/products/days' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npx vite build --base=/products/days/
      - name: Prepare web bundle
        run: tar -czf days-web.tgz -C dist .
      - name: Upload web to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          test -n "$DAYS_WEB_ROOT"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          remote_root=$(printf '%q' "$DAYS_WEB_ROOT")
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "mkdir -p $remote_root"
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no days-web.tgz "$SERVER_USER@$SERVER_HOST:/tmp/days-web.tgz"
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "set -e; rm -rf /tmp/days-web-release; mkdir -p /tmp/days-web-release; tar -xzf /tmp/days-web.tgz -C /tmp/days-web-release; find $remote_root -mindepth 1 -maxdepth 1 ! -name kemiao-days.apk ! -name 'kemiao-days.apk.*' ! -name kemiao-days-release.json ! -name kemiao-days-windows.exe -exec rm -rf {} +; cp -a /tmp/days-web-release/. $remote_root/; rm -rf /tmp/days-web-release /tmp/days-web.tgz"
          rm -f deploy_key
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-web
          path: dist

  bff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build BFF
        run: npm run build:server
      - name: Upload BFF and nginx snippet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            server/dist/index.mjs server/dist/index.cjs server/days-sync/nginx-days-sync.conf \
            "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" 'set -e
              BFF_DIR=/opt/kemiao-days-sync
              if systemctl cat kemiao-days-sync >/dev/null 2>&1; then
                EXEC=$(systemctl show -p ExecStart --value kemiao-days-sync || true)
                case "$EXEC" in
                  */*.mjs*) BFF_DIR=$(dirname "$(echo "$EXEC" | sed -n "s/.*\s\(\/[^ ]*index.mjs\).*/\1/p")") ;;
                esac
              fi
              if [ -z "$BFF_DIR" ] || [ "$BFF_DIR" = "." ]; then BFF_DIR=/opt/kemiao-days-sync; fi
              sudo mkdir -p "$BFF_DIR" /etc/nginx/snippets
              if [ -f "$BFF_DIR/index.mjs" ]; then sudo cp -a "$BFF_DIR/index.mjs" "$BFF_DIR/index.mjs.bak"; fi
              if [ -f "$BFF_DIR/index.cjs" ]; then sudo cp -a "$BFF_DIR/index.cjs" "$BFF_DIR/index.cjs.bak"; fi
              sudo mv /tmp/index.mjs "$BFF_DIR/index.mjs"
              sudo mv /tmp/index.cjs "$BFF_DIR/index.cjs"
              sudo mv /tmp/nginx-days-sync.conf /etc/nginx/snippets/kemiao-days-sync.conf
              if ! grep -q "kemiao-days-sync.conf" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null; then
                echo "WARN: include snippets/kemiao-days-sync.conf 可能还没写进站点配置"
              fi
              if ! grep -q "location ^~ /api/days/admin" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/nginx/snippets/kemiao-days-sync.conf 2>/dev/null; then
                echo "WARN: nginx 还没有 /api/days/admin"
              fi
              sudo nginx -t
              sudo systemctl reload nginx
              if systemctl list-unit-files | grep -q kemiao-days-sync; then
                sudo systemctl restart kemiao-days-sync
                sleep 1
                if ! curl -fsS -m 5 http://127.0.0.1:3120/api/days/health >/dev/null; then
                  echo "BFF health failed; restoring previous build" >&2
                  if [ -f "$BFF_DIR/index.mjs.bak" ]; then sudo cp -a "$BFF_DIR/index.mjs.bak" "$BFF_DIR/index.mjs"; fi
                  if [ -f "$BFF_DIR/index.cjs.bak" ]; then sudo cp -a "$BFF_DIR/index.cjs.bak" "$BFF_DIR/index.cjs"; else sudo rm -f "$BFF_DIR/index.cjs"; fi
                  sudo systemctl restart kemiao-days-sync
                  exit 1
                fi
              fi
              curl -fsS -m 5 http://127.0.0.1:3120/api/days/health
            '
          rm -f deploy_key

  report:
    if: always()
    needs: [web, bff]
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RESULT: ${{ needs.web.result }}
          BFF_RESULT: ${{ needs.bff.result }}
        run: |
          if [[ "$WEB_RESULT" == "success" && "$BFF_RESULT" == "success" ]]; then
            state=success
            description="web=success bff=success"
          else
            state=failure
            description="web=$WEB_RESULT bff=$BFF_RESULT"
          fi
          jq -n --arg state "$state" --arg description "$description"             '{state:$state, context:"deployment/rishi", description:$description}' > status.json
          curl --fail-with-body -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @status.json
