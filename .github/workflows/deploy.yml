name: Deploy Days

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Prepare web bundle
        run: tar -czf days-web.tgz -C dist .
      - name: Upload web to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no days-web.tgz "$SERVER_USER@$SERVER_HOST:/tmp/days-web.tgz"
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'set -e; rm -rf /tmp/days-web-release; mkdir -p /tmp/days-web-release; tar -xzf /tmp/days-web.tgz -C /tmp/days-web-release; find /var/www/yyds-course-platform/public/products/days -mindepth 1 -maxdepth 1 ! -name "kemiao-days.apk" ! -name "kemiao-days-windows.exe" -exec rm -rf {} +; cp -a /tmp/days-web-release/. /var/www/yyds-course-platform/public/products/days/; rm -rf /tmp/days-web-release /tmp/days-web.tgz'
          rm -f deploy_key
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-web
          path: dist

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Package Windows desktop
        shell: pwsh
        run: npx --yes electron-builder --win --x64 --publish never
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer was not produced' }
          Copy-Item $exe.FullName release/kemiao-days-windows.exe -Force
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-windows
          path: release/kemiao-days-windows.exe

  deploy-windows:
    needs: desktop-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: days-windows
          path: release
      - name: Upload Windows installer to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no release/kemiao-days-windows.exe "$SERVER_USER@$SERVER_HOST:/var/www/yyds-course-platform/public/products/days/kemiao-days-windows.exe"
          rm -f deploy_key

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without Electron binary download
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts
      - name: Build web and sync Android
        run: npm run build:android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kemiao-days.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-android
          path: kemiao-days.apk

  deploy-android:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: days-android
          path: release
      - name: Upload Android APK to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no release/kemiao-days.apk "$SERVER_USER@$SERVER_HOST:/var/www/yyds-course-platform/public/products/days/kemiao-days.apk"
          rm -f deploy_key

  ios-project:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create iOS platform
        run: npx cap add ios || true
      - name: Build web and sync iOS
        run: npm run build && npx cap sync ios
      - name: Archive iOS project
        run: zip -qr days-ios-project.zip ios
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: days-ios-project
          path: days-ios-project.zip
