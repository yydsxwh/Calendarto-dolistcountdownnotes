name: Deploy Days

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npx vite build --base=/products/days/
      - name: Prepare web bundle
        run: tar -czf days-web.tgz -C dist .
      - name: Upload web to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no days-web.tgz "$SERVER_USER@$SERVER_HOST:/tmp/days-web.tgz"
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'set -e; rm -rf /tmp/days-web-release; mkdir -p /tmp/days-web-release; tar -xzf /tmp/days-web.tgz -C /tmp/days-web-release; find /var/www/yyds-course-platform/public/products/days -mindepth 1 -maxdepth 1 ! -name "kemiao-days.apk" ! -name "kemiao-days-windows.exe" -exec rm -rf {} +; cp -a /tmp/days-web-release/. /var/www/yyds-course-platform/public/products/days/; rm -rf /tmp/days-web-release /tmp/days-web.tgz'
          rm -f deploy_key
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-web
          path: dist

  bff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build BFF
        run: npm run build:server
      - name: Upload BFF and nginx snippet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            server/dist/index.mjs server/days-sync/nginx-days-sync.conf \
            "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" 'set -e
              BFF_DIR=/opt/kemiao-days-sync
              if systemctl cat kemiao-days-sync >/dev/null 2>&1; then
                EXEC=$(systemctl show -p ExecStart --value kemiao-days-sync || true)
                case "$EXEC" in
                  */*.mjs*) BFF_DIR=$(dirname "$(echo "$EXEC" | sed -n "s/.*\s\(\/[^ ]*index.mjs\).*/\1/p")") ;;
                esac
              fi
              if [ -z "$BFF_DIR" ] || [ "$BFF_DIR" = "." ]; then BFF_DIR=/opt/kemiao-days-sync; fi
              sudo mkdir -p "$BFF_DIR" /etc/nginx/snippets
              if [ -f "$BFF_DIR/index.mjs" ]; then sudo cp -a "$BFF_DIR/index.mjs" "$BFF_DIR/index.mjs.bak"; fi
              sudo mv /tmp/index.mjs "$BFF_DIR/index.mjs"
              sudo mv /tmp/nginx-days-sync.conf /etc/nginx/snippets/kemiao-days-sync.conf
              if ! grep -q "kemiao-days-sync.conf" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null; then
                echo "WARN: include snippets/kemiao-days-sync.conf 可能还没写进站点配置"
              fi
              if ! grep -q "location ^~ /api/days/admin" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/nginx/snippets/kemiao-days-sync.conf 2>/dev/null; then
                echo "WARN: nginx 还没有 /api/days/admin"
              fi
              sudo nginx -t
              sudo systemctl reload nginx
              if systemctl list-unit-files | grep -q kemiao-days-sync; then
                sudo systemctl restart kemiao-days-sync
              fi
              curl -sS -m 5 http://127.0.0.1:3120/api/days/health || true
            '
          rm -f deploy_key

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Package Windows desktop
        shell: pwsh
        run: npx --yes electron-builder --win --x64 --publish never
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer was not produced' }
          Copy-Item $exe.FullName release/kemiao-days-windows.exe -Force
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-windows
          path: release/kemiao-days-windows.exe

  deploy-windows:
    needs: desktop-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: days-windows
          path: release
      - name: Upload Windows installer to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no release/kemiao-days-windows.exe "$SERVER_USER@$SERVER_HOST:/var/www/yyds-course-platform/public/products/days/kemiao-days-windows.exe"
          rm -f deploy_key

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without Electron binary download
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts
      - name: Build web and sync Android
        run: npm run build:android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "BLOCKED: 缺少 ANDROID_KEYSTORE_BASE64。正式签名 Secret 未配置时" >&2
            echo "不会产出 release APK，也不会覆盖线上文件。需要配置的 Secret：" >&2
            echo "  ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify signature and hash
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk kemiao-days.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose --print-certs kemiao-days.apk
          sha256sum kemiao-days.apk | tee kemiao-days.apk.sha256
          ls -l kemiao-days.apk
      - name: Drop keystore from the runner
        if: always()
        run: rm -f android/app/release.keystore
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-android
          path: |
            kemiao-days.apk
            kemiao-days.apk.sha256

  deploy-android:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: days-android
          path: release
      - name: Upload Android APK to Hong Kong server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -p "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'mkdir -p /var/www/yyds-course-platform/public/products/days'
          scp -i deploy_key -P "${SERVER_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no release/kemiao-days.apk "$SERVER_USER@$SERVER_HOST:/var/www/yyds-course-platform/public/products/days/kemiao-days.apk"
          rm -f deploy_key

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build and sync iOS client
        run: npm run build:ios
      - name: Build iOS Simulator app
        run: npm run ios:simulator
      - name: Archive iOS Xcode project
        run: zip -qr days-ios-project.zip ios
      - name: Archive simulator app
        run: |
          APP_PATH="$(find ios-build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" days-ios-simulator-app.zip
      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: days-ios-project
          path: days-ios-project.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: days-ios-simulator
          path: days-ios-simulator-app.zip
