# Included from http {} so the APK location can use access_log ... kemiao_apk.
# No cookie, authorization, or account fields.
log_format kemiao_apk '$time_iso8601 rid=$request_id $status $server_protocol $request_method "$uri" range="$http_range" content_range="$sent_http_content_range" content_length="$sent_http_content_length" body=$body_bytes_sent rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';
