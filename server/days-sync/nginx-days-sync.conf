# 颗秒日事 BFF：同步、OIDC、OCR、文件都挂在主站同源 /api/days/ 下。
# 用精确匹配，不要用 ^~ /api/days/ —— 那会抢走 Next 其它同前缀路由。
# /api/days/files 带 id，单独用前缀。

location = /api/days/health {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /api/days/sync {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 8m;
    proxy_read_timeout 30s;
}

location = /api/days/timetable-ocr {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
}

location = /api/days/auth/login {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

location = /api/days/auth/callback {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

location = /api/days/auth/session {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
}

location = /api/days/auth/logout {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
}

location = /api/days/auth/handoff {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 1m;
}

location ^~ /api/days/files {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
}
