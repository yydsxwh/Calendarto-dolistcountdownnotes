# 颗秒日事 云同步：把同步接口挂到主站同源的 /api/days/ 下。
#
# 用精确匹配（location =），不要用 ^~ /api/days/ —— 那会把 /api/days/ 下面
# 其它属于 Next 应用的路由（例如课表识图 timetable-ocr）一起抢走。
#
# 放进 server 块，位置在 `location ^~ /products/days/` 附近即可。

location = /api/days/sync {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 同步服务要靠这个 Cookie 向主站换取用户身份。
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    client_max_body_size 8m;
    proxy_read_timeout 30s;
}

location = /api/days/health {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
